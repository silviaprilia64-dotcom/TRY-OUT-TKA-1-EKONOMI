function begin(){
 const v=id=>$('#'+id).value.trim();
 if(!v('fn')||!v('fk')||!v('fs'))return home('Nama, kelas, dan asal sekolah wajib diisi.');
 U={n:v('fn'),k:v('fk'),p:v('fp'),s:v('fs')};
 A=Q.map(q=>q.t==='pg'?null:q.t==='mc'?[]:Array((q.s).length).fill(null));D=Q.map(()=>0);i=0;left=DUR;
 tm=setInterval(()=>{left--;const e=$('#tm');if(e){e.textContent=fmt(left);e.classList.toggle('low',left<300)}if(left<=0)finish()},1000);
 exam();window.scrollTo(0,0)}

function exam(){
 const q=Q[i];let body='';
 if(q.t==='pg')body=q.o.map((t,j)=>`<button class="op ${A[i]===j?'s':''}" onclick="pick(${j})"><span class=mk>${L(j)}</span><span>${esc(t)}</span></button>`).join('');
 else if(q.t==='mc')body=q.o.map((t,j)=>`<button class="op ${A[i].includes(j)?'s':''}" onclick="tog(${j})"><span class="mk sq">${A[i].includes(j)?'✓':L(j)}</span><span>${esc(t)}</span></button>`).join('');
 else body=q.s.map((t,r)=>`<div class=ro><div>${r+1}. ${esc(t)}</div><div class=bs><button class="${A[i][r]===1?'s':''}" onclick="bsv(${r},1)">Benar</button><button class="${A[i][r]===0?'s':''}" onclick="bsv(${r},0)">Salah</button></div></div>`).join('');
 const nav=Q.map((_,j)=>`<button class="n ${D[j]?'r':ans(j)?'d':''} ${j===i?'c':''}" onclick="jump(${j})">${j+1}</button>`).join('');
 const last=i===Q.length-1;
 app.innerHTML=`<div class=hero><div class="wrap top"><div><b>${esc(U.n)}</b><div style="font-size:.85rem;opacity:.9">${esc(U.k)} · ${esc(U.s)}</div></div><div class="tm ${left<300?'low':''}" id=tm>${fmt(left)}</div></div></div>
 <div class=wrap><div class=lay><div><div class=card><div style="margin-bottom:10px"><b>Soal ${i+1} dari ${Q.length}</b><span class=badge>${TN[q.t]}</span></div>
 <div class=stem>${esc(q.q)}</div>${tb(q)}${q.q2?`<div class=stem>${esc(q.q2)}</div>`:''}
 ${q.t==='mc'?'<div style="color:var(--mut);font-size:.85rem;margin-top:8px">Pilih semua jawaban yang benar.</div>':''}<div style="margin-top:8px">${body}</div>
 <div class=act><button class="btn g" onclick="go(-1)" ${i?'':'disabled'}>← Sebelumnya</button><button class="btn o" onclick="dbt()">${D[i]?'✓ Ragu-ragu':'Ragu-ragu'}</button>${last?'<button class="btn ok" onclick="ask()">Selesai ✔</button>':'<button class=btn onclick="go(1)">Selanjutnya →</button>'}</div></div></div>
 <div class=card style="align-self:start"><h2>Navigasi Soal</h2><div class=grid>${nav}</div>
 <div class=lg><span><i style="background:var(--ok)"></i>Dijawab</span><span><i style="background:var(--wa)"></i>Ragu-ragu</span><span><i style="background:#d1d5db"></i>Belum</span></div>
 <button class="btn ok" style="width:100%;margin-top:14px" onclick="ask()">Selesaikan Try Out</button></div></div></div>`}

const pick=j=>{A[i]=j;exam()};
const tog=j=>{const a=A[i],x=a.indexOf(j);x<0?a.push(j):a.splice(x,1);exam()};
const bsv=(r,v)=>{A[i][r]=v;exam()};
const dbt=()=>{D[i]^=1;exam()};
const go=d=>{i=Math.max(0,Math.min(Q.length-1,i+d));exam();window.scrollTo(0,0)};
const jump=j=>{i=j;exam();window.scrollTo(0,0)};
function ask(){
 const a=Q.filter((_,j)=>ans(j)).length,r=D.filter(Boolean).length;
 const m=document.createElement('div');m.className='mod';m.id='md';
 m.innerHTML=`<div class=card><h2>Selesaikan Try Out?</h2><p>Dijawab: <b>${a}</b> · Belum dijawab: <b>${Q.length-a}</b> · Ragu-ragu: <b>${r}</b></p><div class=act><button class="btn g" onclick="$('#md').remove()">Kembali</button><button class="btn ok" onclick="finish()">Ya, Selesai</button></div></div>`;
 document.body.appendChild(m)}

function finish(){
 clearInterval(tm);const md=$('#md');if(md)md.remove();
 const S=Q.map((_,j)=>ans(j)||(Q[j].t==='mc'&&A[j].length)?sc(j):(Q[j].t==='bs'&&A[j].some(x=>x!=null)?sc(j):0));
 const used=Q.map((_,j)=>Q[j].t==='pg'?A[j]!=null:Q[j].t==='mc'?A[j].length>0:A[j].some(x=>x!=null));
 const tot=S.reduce((a,b)=>a+b,0),nilai=Math.round(tot/Q.length*100);
 const full=S.filter(s=>s===1).length,part=S.filter((s,j)=>s>0&&s<1).length,kos=used.filter(u=>!u).length,wr=Q.length-full-part-kos;
 const pred=nilai>=80?'Sangat Baik 🌟':nilai>=60?'Baik 👍':nilai>=40?'Cukup, terus berlatih 💪':'Perlu belajar lagi 📚';
 const rv=Q.map((q,j)=>{
  const st=!used[j]?['Tidak dijawab','#6b7280','x']:S[j]===1?['Benar','#16a34a','b']:S[j]>0?['Sebagian benar','#d97706','s']:['Salah','#dc2626','x'];
  let ans='';
  if(q.t==='pg')ans=q.o.map((t,x)=>`<div class="ra ${x===q.k?'k':A[j]===x?'w':''}"><b>${L(x)}.</b> ${esc(t)}${x===q.k?' ✔ <b>Kunci</b>':''}${A[j]===x&&x!==q.k?' ✖ jawabanmu':A[j]===x?' (jawabanmu)':''}</div>`).join('');
  else if(q.t==='mc')ans=q.o.map((t,x)=>{const c=q.k.includes(x),s=A[j].includes(x);return `<div class="ra ${c?'k':s?'w':''}"><b>${L(x)}.</b> ${esc(t)} ${c?'✔ <b>Kunci: benar</b>':''}${s?(c?' (kamu pilih)':' ✖ kamu pilih'):''}</div>`}).join('');
  else ans=q.s.map((t,x)=>{const y=A[j][x],ok=y===q.k[x];return `<div class="ra ${ok?'k':'w'}">${x+1}. ${esc(t)}<br><b>Kunci: ${q.k[x]?'Benar':'Salah'}</b> · Jawabanmu: ${y==null?'-':y?'Benar':'Salah'}</div>`}).join('');
  return `<div class="card rv ${st[2]}"><div style="margin-bottom:8px"><b>Soal ${j+1}</b> <span class=tag style="background:${st[1]}">${st[0]}</span><span class=badge>${TN[q.t]}</span></div>
  <div class=stem>${esc(q.q)}</div>${tb(q)}${q.q2?`<div class=stem>${esc(q.q2)}</div>`:''}<div style="margin-top:8px">${ans}</div>
  <div class=ex><b>Pembahasan</b><div class=stem style="margin-top:4px;white-space:pre-wrap">${esc(q.e)}</div></div></div>`}).join('');
 app.innerHTML=`<div class=hero><div class=wrap><h1>🏆 Hasil ${T[SEL].n}</h1><div>Terima kasih telah mengerjakan, ${esc(U.n)}!</div></div></div>
 <div class=wrap><div class="card" style="text-align:center"><div style="color:var(--mut)">Nilai Akhir</div>
 <div class=sc style="--p:${nilai}%"><b>${nilai}</b></div><div style="font-weight:700;margin-bottom:12px">${pred}</div>
 <div class=kv style="text-align:left;max-width:420px;margin:0 auto"><span>Paket</span><b>${T[SEL].n}</b><span>Nama</span><b>${esc(U.n)}</b><span>Kelas</span><b>${esc(U.k)}</b>${U.p?`<span>No. Peserta</span><b>${esc(U.p)}</b>`:''}<span>Asal Sekolah</span><b>${esc(U.s)}</b><span>Waktu terpakai</span><b>${fmt(DUR-Math.max(left,0))}</b></div>
 <div class=st><div style="background:#16a34a">${full}<small>Benar</small></div><div style="background:#d97706">${part}<small>Sebagian</small></div><div style="background:#dc2626">${wr}<small>Salah</small></div><div style="background:#6b7280">${kos}<small>Kosong</small></div></div>
 <div class=act style="justify-content:center"><button class=btn onclick="window.print()">🖨️ Cetak Hasil</button><button class="btn g" onclick="home()">Ulangi Try Out</button></div></div>
 <h2 style="margin:18px 4px 10px">Pembahasan Soal</h2>${rv}</div>`;window.scrollTo(0,0)}
home();
</script></body></html>
