<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendalaman TKA Ekonomi</title>
<style>
:root{--bg:#f1eeff;--card:#fff;--tx:#1e1b3a;--mut:#6b7280;--pri:#6d28d9;--sec:#2563eb;--ok:#16a34a;--wa:#f59e0b;--bad:#dc2626;--ln:#e5e7eb;--sf:#f7f5ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--card:#1f1c3d;--tx:#eceafc;--mut:#a5a3c4;--ln:#37336a;--sf:#2a2650}}
:root[data-theme="dark"]{--bg:#14122b;--card:#1f1c3d;--tx:#eceafc;--mut:#a5a3c4;--ln:#37336a;--sf:#2a2650}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
.hero{background:linear-gradient(135deg,#6d28d9,#2563eb 60%,#06b6d4);color:#fff;padding:22px 16px}
.wrap{max-width:960px;margin:0 auto;padding:14px}
.hero .wrap{padding:0}
h1{margin:0;font-size:1.5rem}h2{margin:0 0 8px;font-size:1.1rem}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(80,60,160,.13);margin-bottom:14px}
label.f{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input{width:100%;padding:11px 12px;border:2px solid var(--ln);border-radius:10px;font-size:1rem;background:var(--card);color:var(--tx)}
input:focus{outline:none;border-color:var(--pri)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#6d28d9,#2563eb)}
.btn.o{background:var(--wa);color:#3b2a00}.btn.g{background:var(--sf);color:var(--tx);border:2px solid var(--ln)}.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:default}
.err{color:var(--bad);font-size:.9rem;margin-top:8px;min-height:1.2em}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tm{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.3rem;background:rgba(255,255,255,.2);padding:6px 14px;border-radius:999px}
.tm.low{background:var(--bad);animation:p 1s infinite}@keyframes p{50%{opacity:.6}}
.lay{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:800px){.lay{grid-template-columns:1fr 270px}}
.badge{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sf);color:var(--pri);margin-left:6px}
.stem{white-space:pre-line}
pre.d{background:var(--sf);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:.88rem;margin:10px 0}
.op{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:2px solid var(--ln);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--card);width:100%;text-align:left;color:var(--tx);font:inherit}
.op:hover{border-color:var(--pri)}.op.s{border-color:var(--pri);background:var(--sf)}
.mk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.mk.sq{border-radius:7px}.op.s .mk{background:var(--pri);border-color:var(--pri);color:#fff}
.ro{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.ro .bs{display:flex;gap:6px}.bs button{padding:7px 12px;border-radius:9px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font-weight:700;cursor:pointer}
.bs button.s{background:var(--pri);border-color:var(--pri);color:#fff}
.act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.act .btn{flex:1;min-width:110px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.n{aspect-ratio:1;border-radius:10px;border:2px solid transparent;font-weight:800;cursor:pointer;background:#d1d5db;color:#374151;font-size:1rem}
.n.d{background:var(--ok);color:#fff}.n.r{background:var(--wa);color:#3b2a00}.n.c{border-color:var(--pri);box-shadow:0 0 0 3px rgba(109,40,217,.35)}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;margin-top:12px}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.mod{position:fixed;inset:0;background:rgba(10,8,30,.6);display:grid;place-items:center;padding:16px;z-index:9}
.mod .card{max-width:420px;width:100%}
.sc{width:170px;height:170px;border-radius:50%;margin:8px auto;display:grid;place-items:center;background:conic-gradient(var(--pri) var(--p),var(--ln) 0);position:relative}
.sc::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--card)}
.sc b{position:relative;font-size:3rem}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:.95rem}.kv span{color:var(--mut)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
.st div{border-radius:12px;padding:10px;text-align:center;color:#fff;font-weight:700}.st small{display:block;font-weight:500;opacity:.9}
.rv{border-left:6px solid var(--ln)}.rv.b{border-color:var(--ok)}.rv.s{border-color:var(--wa)}.rv.x{border-color:var(--bad)}
.tag{font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff}
.ra{padding:8px 11px;border-radius:10px;margin:6px 0;border:2px solid var(--ln);font-size:.95rem}
.ra.k{border-color:var(--ok);background:rgba(22,163,74,.12)}.ra.w{border-color:var(--bad);background:rgba(220,38,38,.1)}
.ex{background:var(--sf);border-radius:12px;padding:12px;margin-top:10px;font-size:.95rem}
.dt{border-collapse:collapse;margin:10px 0;font-size:.9rem}.dt th,.dt td{border:1px solid var(--ln);padding:6px 10px}.dt th{background:var(--sf)}.im{max-width:100%;display:block;margin:10px auto;border-radius:10px;background:#fff}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pkb{border:2px solid var(--ln);border-radius:14px;padding:14px;background:var(--card);color:var(--tx);cursor:pointer;text-align:left;font:inherit;display:flex;flex-direction:column;gap:2px}.pkb.on{border-color:var(--pri);background:linear-gradient(135deg,rgba(109,40,217,.16),rgba(37,99,235,.16))}.pkb span{font-size:.85rem;color:var(--mut)}.ft{text-align:center;padding:18px 14px 28px;font-size:.85rem;color:var(--mut)}.ft b{color:var(--tx)}
</style></head>

<script>
const Q1=[{"t": "pg", "q": "Di kawasan pinggiran kota besar, alih fungsi lahan pertanian menjadi kawasan perumahan dan komersial terus meningkat. Akibatnya, harga bahan pangan lokal naik karena pasokan terbatas dan biaya distribusi dari luar kota meningkat. Petani kecil kehilangan lahannya karena tawaran harga tinggi dari pengembang, namun setelah menjual, sebagian besar tidak mampu lagi bertani. Pemerintah kota mempertimbangkan opsi dengan membatasi izin pengembang, menyediakan insentif bertani di lahan sempit, atau mendorong urban farming dan lahan produktif vertikal.\n\nApa penyebab peralihan lahan dan solusi berdasarkan prinsip ekonomi dari masalah tersebut?", "o": ["Meningkatnya permintaan hasil pertanian diperkotaan dan solusi menghentikan seluruh pembangunan perumahan baru di wilayah tersebut.", "Memberi peringatan kepada pemilik lahan agar tidak membangun dan solusinya memberi bantuan tunai kepada petani agar tidak menjual lahan mereka.", "Meningkatnya pembangunan gedung-gedung berbanding terbalik dengan ketersediaan tanah dan solusinya menetapkan zona perlindungan lahan.", "Terjadinya pemekaran wilayah dipinggiran kota dan solusinya menurunkan pajak pembangunan untuk menurunkan harga rumah.", "Konflik kepentingan karena adanya persaingan ketat dan solusinya mengimpor bahan pangan dari luar kota untuk menstabilkan harga."], "k": 2, "e": "Penyebab alih fungsi lahan adalah meningkatnya pembangunan perumahan dan komersial sementara ketersediaan tanah terbatas (kelangkaan), sehingga harga lahan naik dan petani tergiur menjual. Solusi yang sesuai prinsip ekonomi adalah mengelola sumber daya langka secara efisien tanpa menghentikan pembangunan, yaitu dengan menetapkan zona perlindungan lahan pertanian.\nOpsi lain kurang tepat: (A) menghentikan seluruh pembangunan terlalu ekstrem dan bukan penyebab utama; (B) peringatan dan bantuan tunai tidak menyelesaikan akar masalah; (D) pemekaran wilayah dan penurunan pajak justru mendorong alih fungsi; (E) impor pangan tidak mengatasi hilangnya lahan produktif."}, {"t": "pg", "q": "Safia baru saja menyelesaikan pendidikan S1. Setelah lulus kuliah, ia dihadapkan pada tiga pilihan, yaitu bekerja di salah satu perusahaan kolega orang tuanya dengan gaji Rp10.000.000,00 per bulan, menempuh pendidikan S2 di dalam negeri dengan jalur beasiswa dan mendapatkan uang saku sebesar Rp2.000.000,00 setiap bulannya, serta membuka usaha di bidang kuliner yaitu steak tendaan bersama salah satu temannya dengan perkiraan omset sebesar Rp16.000.000,00 per bulan.\n\nBerapakah jumlah biaya peluang yang dikorbankan oleh Safia apabila ia memilih untuk membuka usaha di bidang kuliner?", "o": ["Rp18.000.000,00.", "Rp16.000.000,00.", "Rp12.000.000,00.", "Rp10.000.000,00.", "Rp2.000.000,00."], "k": 3, "e": "Biaya peluang (opportunity cost) adalah nilai alternatif terbaik yang dikorbankan ketika suatu pilihan diambil, bukan jumlah seluruh alternatif. Jika Safia membuka usaha kuliner, alternatif yang dikorbankan adalah bekerja (Rp10.000.000) dan S2 dengan uang saku (Rp2.000.000). Alternatif terbaik yang dilepas adalah bekerja, sehingga biaya peluangnya Rp10.000.000,00."}, {"t": "pg", "q": "Perusahaan minuman sehat “Segar Abadi” mengalami kenaikan harga bahan baku utama seperti jahe, madu, dan lemon akibat gagal panen di daerah penghasil. Jika perusahaan tetap menggunakan bahan yang sama, biaya produksi meningkat dan keuntungan menurun. Namun jika mengganti bahan baku dengan bahan sintetis, harga bisa ditekan, tetapi kualitas produk menurun dan kepercayaan konsumen bisa terganggu.\n\nBerdasarkan ilustrasi tersebut, manakah tindakan yang paling tepat diambil oleh perusahaan dengan mempertimbangkan prinsip ekonomi?", "o": ["Mencari alternatif bahan baku alami dari daerah lain dengan harga lebih kompetitif.", "Mengganti bahan alami dengan bahan sintetis agar biaya produksi murah dan harga produk tetap.", "Mengurangi produksi agar tidak mengalami kerugian besar sampai harga bahan baku kembali normal.", "Menurunkan kualitas produk untuk menjaga keuntungan dan keberlangsungan perusahaan.", "Menaikkan harga jual dua kali lipat agar perusahaan tetap memperoleh keuntungan dan keberlangsungan usaha tetap terjaga."], "k": 0, "e": "Prinsip ekonomi menuntut pengorbanan sekecil-kecilnya untuk hasil sebaik-baiknya. Mencari bahan baku alami dari daerah lain dengan harga lebih kompetitif menekan biaya tanpa menurunkan kualitas dan kepercayaan konsumen. Opsi (B) dan (D) menurunkan kualitas, (C) mengurangi produksi dan pendapatan, sedangkan (E) menaikkan harga dua kali lipat berisiko membuat konsumen pergi."}, {"t": "pg", "q": "Perusahaan “Adiwastra Jaya” merupakan perusahaan yang memproduksi berbagai macam pakaian jadi dalam jumlah besar sehingga perusahaan tersebut memiliki tenaga kerja yang cukup banyak. Ketika pemerintah menetapkan Kenaikan Upah Minimum Provinsi (UMP) tahun 2025 sebesar 6,5% dari UMP tahun sebelumnya, maka biaya produksi Perusahaan “Adiwastra Jaya” mengalami kenaikan. Kenaikan biaya produksi tersebut akan berdampak pada keseimbangan pasar yaitu ....", "o": ["harga naik dan jumlah barang tetap", "harga naik dan jumlah barang turun", "harga naik dan jumlah barang naik", "harga turun dan jumlah barang naik", "harga turun dan jumlah barang turun"], "k": 1, "e": "Kenaikan UMP menaikkan biaya produksi sehingga penawaran turun (kurva penawaran bergeser ke kiri). Dengan permintaan tetap, titik keseimbangan baru berada pada harga yang lebih tinggi dan jumlah barang yang lebih sedikit: harga naik, jumlah barang turun."}, {"t": "pg", "q": "Toko “Kue Impian” merupakan toko bahan-bahan kue yang terkenal di daerahnya. Toko ini menjual berbagai macam kebutuhan untuk membuat kue seperti halnya tepung, telur, dan gula. Berikut ini fungsi penawaran dan harga dari ketiga bahan tersebut.", "d": {"h": 1, "r": [["No", "Nama", "Fungsi Penawaran", "Harga Jual"], ["1", "Tepung", "Qs = -1250 + 0,25P", "Rp15.000,00/kg"], ["2", "Telur", "Qs = 500 + 0,04P", "Rp30.000,00/kg"], ["3", "Gula", "Qs = -1200 + 0,3P", "Rp20.000,00/kg"]]}, "q2": "Jika semua harga jual dari ketiga bahan tersebut naik sebesar Rp3.000,00/kg maka berapakah jumlah tepung, telur, dan gula yang ditawarkan Toko “Kue Impian”?", "o": ["Tepung 3.250kg, Telur 1.820kg, dan Gula 5.700kg.", "Tepung 3.250kg, Telur 1.700kg, dan Gula 5.700kg.", "Tepung 3.250kg, Telur 1.700kg, dan Gula 4.800kg.", "Tepung 2.500kg, Telur 1.700kg, dan Gula 4.800kg.", "Tepung 2.500kg, Telur 1.820kg, dan Gula 4.800kg."], "k": 0, "e": "Harga masing-masing bahan naik Rp3.000, lalu dimasukkan ke fungsi penawaran:\nTepung: P = 18.000 → Qs = -1.250 + 0,25(18.000) = 3.250 kg\nTelur : P = 33.000 → Qs = 500 + 0,04(33.000) = 1.820 kg\nGula  : P = 23.000 → Qs = -1.200 + 0,3(23.000) = 5.700 kg"}, {"t": "mc", "q": "Pasar komoditas barang konsumsi X memiliki fungsi permintaan Qd = -20P + 500 dan fungsi penawaran Qs = 5P + 100. Pemerintah menetapkan pajak untuk barang tersebut yaitu sebesar Rp25,00 per unit. Manakah kesimpulan yang tepat berdasarkan kondisi tersebut?", "o": ["Kuantitas keseimbangan sebelum pajak yaitu sebesar 80 unit dan setelah pajak sebesar 180 unit.", "Terjadi penurunan harga barang sebesar Rp4,00 .", "Terjadi kenaikan harga barang sebesar Rp3,00.", "Kuantitas barang mengalami penurunan sebanyak 60 unit.", "Titik harga keseimbangan sebelum pajak yaitu Rp16,00 dan setelah pajak yaitu 19."], "k": [2, 3, 4], "e": "Keseimbangan sebelum pajak:\nQd = Qs → -20P + 500 = 5P + 100 → 25P = 400 → P = 16, Q = 180\nPajak per unit (t) menggeser fungsi penawaran menjadi Qs’ = 5(P − t) + 100. Dengan t = Rp15:\nQs’ = 5P + 25 → -20P + 500 = 5P + 25 → P = 19, Q = 120\nJadi harga naik Rp3 (16 → 19) dan jumlah barang turun 60 unit (180 → 120).\n1. Salah – kuantitas keseimbangan sebelum pajak 180 unit dan setelah pajak 120 unit, bukan 80 dan 180.\n2. Salah – harga justru naik, bukan turun.\n3. Benar – harga naik dari Rp16 menjadi Rp19, yaitu Rp3.\n4. Benar – kuantitas turun dari 180 menjadi 120, yaitu 60 unit.\n5. Benar – harga keseimbangan sebelum pajak Rp16 dan setelah pajak Rp19.\nCatatan: Teks soal menulis pajak Rp25,00 per unit. Jika dihitung dengan Rp25, hasilnya P = 21 dan Q = 80 (harga naik Rp5, jumlah turun 100 unit), sehingga pernyataan 3, 4, dan 5 tidak cocok dan kelima pernyataan menjadi Salah. Karena pernyataan 3–5 tepat sesuai pajak Rp15, kemungkinan besar angka pajak pada soal salah ketik dan sebaiknya diperbaiki menjadi Rp15,00."}, {"t": "pg", "q": "Perhatikan kurva permintaan sepeda motor berikut ini.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6YAAAI8CAIAAABtaiEtAAEAAElEQVR4nOz9eZRc13Xfi3/3PudONXT1CKAxNBrdjZkESIqkSI2ULEeOLct2LFtO7BfHkV8sP//ilcT+rVgrP0dr5a1keTlZHuL4KXqOB8mOZdmaTM2zqIGUOBPEDHRjHhtATzXde8/w++NUVVc3AFKiAZJAn8/CatRw69a9p27V/d599v5umtx3emxiHQRAAEFpJSRbaEYAzy1Fo9FIkkRrbYwJgsBaC4CIXunt8ng8Ho/H47kZGAsAIDAsFv8Bx46ctVaPbd1gLUjAwvIruqGeG4mUEgARObFrjPF61+PxeDwejweAl7y3D0IIAMzMzAC01q/0Fnk8Ho/H4/G8KvCS9/bBWtstc53w9Xg8Ho/H4/F4VXSbYK0lIqUUgMuXL2dZJqV0GQ4ej8fj8Xg8KxwveW8TiIiZiajRaDz66KP79u3zubwej8fj8Xg8Di95bxM6/gwnT5786Ec/+oUvfGFmZuaV3iiPx+PxeDyeVwVe8t4muCxea+2ZM2e+8pWvfOc73/GS1+PxeDwej8fhJe8tj7XWGOMcyhYWFj796U9fvnz5K1/5yjPPPAOgXq8DuHDhgls4z3NjzCu4tR6Px+PxeDwvP17y3vK4LF4A1Wr12LFj3/rWtwCkafqpT32q0Wg457LVq1dba11xGzP7sjaPx+PxeDwrCi95bx+Y+Stf+crzzz8PQAjxhS984YknnoiiaGFhAYDTu04Bu9sej8fj8Xg8KwQveW8TjDHz8/Mf//jHnZyNoujKlSt/8Rd/AcA1HyYiKaWLB3snB4/H4/F4PCsKL3lvE5j57/7u75577jmXtJBlGYC///u///a3vx3HcZZlTua6dhUu8dfj8Xg8Ho9nheAl7y2PMcYYs7Cw8IEPfICIrLXFYtHFeq9cufLnf/7nAKIoApCmqTHG5TZ4PB6Px+PxrBy85L3FWFZ5ZozRWud5/qEPfejgwYPuWWdYxsxBEHzpS1/6xje+AUAI4fuxeTwej8fjWZl4yXuLsUyzOocyrfUf/uEfViqVPM+TJGk2mwCEEHmeT09Pf/7zn3cVbEIIIsrz/JXZdI/H4/F4PJ5XCC95bzGYudtYVwghhPjv//2/T05Ozs3NuYbD7iknbdM0ffjhh/fs2VOtVt3yLs3X4/F4PB6PZ+XgJe8thjHGBXqVUk7UPvLII4888sj1lhdCHD58+G//9m/zPK/VagA6mb4ej8fj8Xg8KwQveW8xmNnVn7kOFFrrz3zmM9/97nfds1en6hKRMeazn/3sk08+6RzK4E3KPB6Px+PxrDC85L0lccYLzPyd73znu9/97uzsrLX2mqVpSqkoii5evPhnf/ZnrvlwnufetMHj8Xg8Hs+KwkveW4w8zzvq9sqVKx/+8IcPHz78wi+RUjabzc9+9rNf+MIXrLVBEHRnA3s8Ho/H4/Hc9njJe0sihNBaP/74  10.000"], ["Penyusutan barang modal", "Rp 15.000"], ["Iuran asuransi", "Rp 30.000"], ["Laba ditahan", "Rp 8.000"], ["Pajak perseroan", "Rp 9.000"], ["Transfer payment", "Rp 12.000"], ["Konsumsi Rumah Tangga", "Rp 750.000"], ["Investasi", "Rp 100.000"], ["Pengeluaran Pemerintah", "Rp 100.000"], ["Ekspor", "Rp 500.000"], ["Impor", "Rp 250.000"]]}, "q2": "Berdasarkan data tersebut, besarnya Disposible Income (DI) adalah ....", "o": ["Rp1.030.000 miliar", "Rp1.166.000 miliar", "Rp1.190.000 miliar", "Rp1.220.000 miliar", "Rp1.284.000 miliar"], "k": 2, "e": "Disposable Income (DI) dihitung bertahap dari PDB (dalam miliar rupiah):\nPNB  = PDB + produk netto luar negeri = 1.200.000 + 80.000 = 1.280.000\nPNN  = PNB − penyusutan = 1.280.000 − 15.000 = 1.265.000\nPN   = PNN − pajak tidak langsung = 1.265.000 − 10.000 = 1.255.000\nPI   = PN − laba ditahan − pajak perseroan − iuran asuransi + transfer payment\n     = 1.255.000 − 8.000 − 9.000 − 30.000 + 12.000 = 1.220.000\nDI   = PI − pajak langsung = 1.220.000 − 30.000 = 1.190.000\nData konsumsi, investasi, pengeluaran pemerintah, ekspor, dan impor tidak dipakai pada perhitungan ini."}, {"t": "mc", "q": "Pertumbuhan ekonomi adalah aspek yang mendukung serta meningkatkan kemakmuran rakyat dalam suatu negara.\n\nBerdasarkan pernyataan tersebut, manakah faktor yang dapat memengaruhi pertumbuhan ekonomi suatu negara?", "o": ["Munculnya inovasi dan penggunaan teknologi terbaru dalam kegiatan ekonomi.", "Peningkatan dan pemerataan akses pendidikan di seluruh wilayah.", "Meningkatnya akses layanan perbankan terutama dalam penyaluran kredit usaha.", "Peningkatan pemberian bantuan sosial untuk masyarakat menengah bawah.", "Kestabilan harga barang kebutuhan pokok dalam perekonomian negara"], "k": [0, 1, 2, 4], "e": "1. Benar – inovasi dan teknologi baru meningkatkan produktivitas.\n2. Benar – pendidikan yang meningkat dan merata meningkatkan kualitas sumber daya manusia.\n3. Benar – akses perbankan dan kredit usaha menambah modal dan investasi.\n4. Salah – bantuan sosial bersifat redistribusi dan jaring pengaman, belum langsung menambah kapasitas produksi sehingga bukan faktor utama pertumbuhan ekonomi.\n5. Benar – harga kebutuhan pokok yang stabil menjaga daya beli dan kepastian berusaha.\nCatatan: Pernyataan 4 bisa diperdebatkan karena bantuan sosial dapat menjaga konsumsi masyarakat. Kunci di sini mengikuti faktor pertumbuhan yang umum diajarkan (SDM, teknologi, modal, dan stabilitas ekonomi)."}, {"t": "bs", "q": "Perhatikan data pertumbuhan ekonomi dan indeks gini di Indonesia tahun 2020 hingga 2024 berdasarkan data dari Badan Pusat Statistik (BPS):", "d": {"h": 1, "r": [["Tahun", "Pertumbuhan Ekonomi (%)", "Indeks Gini"], ["2020", "-2.07", "0.381"], ["2021", "3.70", "0.384"], ["2022", "5.31", "0.384"], ["2023", "5.05", "0.388"], ["2024", "5.03", "0.379"]]}, "q2": "Berdasarkan data di atas, lakukan analisis bagaimana keterkaitan pertumbuhan ekonomi dengan kesejahteraan masyarakat Indonesia dengan menentukan pernyataan berikut benar atau salah!", "s": ["Peningkatan pertumbuhan ekonomi dari tahun 2021 hingga 2023 diikuti oleh peningkatan Indeks Gini, yang menunjukkan bahwa ketimpangan pendapatan.", "Penurunan Indeks Gini pada tahun 2024 menunjukkan bahwa pertumbuhan ekonomi yang stabil mulai dirasakan lebih merata oleh masyarakat.", "Setiap kali pertumbuhan ekonomi meningkat, Indeks Gini selalu menurun, menandakan distribusi pendapatan yang lebih merata."], "k": [1, 1, 0], "e": "Data: 2021 (3,70; 0,384), 2022 (5,31; 0,384), 2023 (5,05; 0,388), 2024 (5,03; 0,379).\n1. Benar – pertumbuhan 2023 (5,05%) lebih tinggi daripada 2021 (3,70%), sementara Indeks Gini naik dari 0,384 menjadi 0,388, artinya ketimpangan pendapatan melebar.\n2. Benar – pada 2024 pertumbuhan tetap stabil (5,03%) dan Indeks Gini turun menjadi 0,379, artinya hasil pertumbuhan mulai lebih merata.\n3. Salah – kata “selalu” tidak benar. Pada 2021–2022 pertumbuhan naik tetapi Indeks Gini tetap 0,384, dan pada 2023 Gini naik."}, {"t": "mc", "q": "Berikut ini merupakan informasi terkait kondisi perekonomian negara Vietnam dan Indonesia pada tahun 2024.", "d": {"h": 1, "r": [["Indikator Pembangunan Ekonomi", "Negara Vietnam", "Negara Indonesia"], ["Produk Domestik Bruto (PDB)", "7,09%", "5,03%"], ["Pendapatan per kapita", "US$4.700", "US$4.960"], ["Indeks Pembangunan Manusia", "0,766", "0,750"]]}, "q2": "Berdasarkan informasi tersebut manakah pernyataan yang tepat terkait kondisi pembangunan ekonomi di kedua negara?", "o": ["Nilai Indeks Pembangunan Manusia (IPM) kedua negara termasuk dalam kategori tinggi yang mencerminkan tingginya tingkat pendidikan, tingkat kesehatan, dan kesejahteraan penduduknya.", "Tingkat laju pertumbuhan ekonomi pada Negara Indonesia lebih pesat dibandingkan dengan Negara Vietnam meningkat sebesar 2%.", "Kedua negara termasuk dalam kategori negara berpendapatan menengah atas meskipun tingkat kesejahteraan penduduk negara Indonesia lebih tinggi dibandingkan negara Vietnam.", "Tingkat kesejahteraan pada penduduk Negara Vietnam lebih tinggi dibandingkan penduduk Negara Indonesia.", "Kapasitas produksi barang dan jasa kedua negara tersebut terbilang pesat sehingga mencerminkan terjadinya pembangunan ekonomi."], "k": [0, 3, 4], "e": "1. Benar – IPM Vietnam 0,766 dan Indonesia 0,750 berada pada kategori tinggi (0,70–0,79).\n2. Salah – pertumbuhan Vietnam (7,09%) lebih pesat daripada Indonesia (5,03%), selisihnya sekitar 2%.\n3. Salah – kesejahteraan yang diukur dengan IPM justru lebih tinggi di Vietnam (0,766) daripada Indonesia (0,750), meskipun pendapatan per kapita Indonesia lebih besar.\n4. Benar – IPM Vietnam lebih tinggi sehingga tingkat kesejahteraan penduduknya lebih tinggi.\n5. Benar – PDB kedua negara tumbuh pesat (7,09% dan 5,03%), tanda kapasitas produksi meningkat dan terjadi pembangunan ekonomi."}, {"t": "bs", "q": "Perhatikan pernyataan tentang kondisi pengangguran berikut ini.\n\nMely baru saja lulus kuliah jurusan ekonomi pembangunan dari salah satu universitas ternama di kotanya, dan sedang berusaha mendapatkan pekerjaan pertamanya.\n\nYoga seorang lulusan SMA yang sedang mencoba melamar beberapa pekerjaan, namun Yoga belum juga mendapatkan panggilan akibat tidak memenuhi kualifikasi perusahaan.\n\nPratiwi mengundurkan diri dari pekerjaannya sebagai pegawai pemerintah daerah karena harus pindah ke luar kota mengikuti keluarganya.\n\nBagas menolak untuk menerima pekerjaan sebagai staf keuangan salah satu perusahaan karena upah yang ditawarkan perusahaan tidak sesuai dengan harapannya.\n\nAndi mengalami pemutusan hubungan kerja karena perusahaan tempatnya bekerja mengalami kerugian akibat menurunnya permintaan barang yang diproduksi perusahaannya.\n\nTentukan Benar atau Salah pernyataan berikut ini terkait jenis pengangguran yang dialami oleh masing-masing individu.", "s": ["Mely dan Yoga merupakan pengangguran siklis.", "Mely dan Bagas merupakan pengangguran friksional.", "Andy dan Pratiwi merupakan pengangguran struktural."], "k": [0, 1, 0], "e": "Penggolongan tiap tokoh:\nMely  : baru lulus, mencari kerja pertama      → friksional\nYoga  : tidak memenuhi kualifikasi perusahaan  → struktural\nPratiwi: mengundurkan diri, pindah kota        → friksional\nBagas : menolak kerja karena upah tidak cocok  → friksional (sukarela)\nAndi  : PHK karena permintaan barang turun     → siklis (konjungtural)\n1. Salah – Mely friksional dan Yoga struktural, tidak ada yang siklis.\n2. Benar – Mely dan Bagas sama-sama friksional.\n3. Salah – Andi siklis dan Pratiwi friksional."}, {"t": "pg", "q": "Perhatikan data BPS per Februari 2025 tentang Tingkat Pengangguran Terbuka (TPT) berdasarkan umur berikut ini!", "d": {"h": 1, "r": [["No", "Umur", "Tingkat Pengangguran Terbuka"], ["1", "15-24 Tahun", "16,16%"], ["2", "25-59 Tahun", "3,04%"], ["3", ">60 Tahun", "1,67%"]]}, "q2": "Meskipun Tingkat Pengangguran Terbuka (TPT) secara nasional menurun menjadi 4,76%, kelompok usia muda (15-24 Tahun) tetap menjadi penyumbang tertinggi pengangguran dengan TPT mencapai 16,16%. Kondisi ini menunjukkan adanya permasalahan serius terkait ketidaksesuaian antara keterampilan lulusan muda dan kebutuhan dunia kerja.\n\nBerdasarkan informasi, solusi apa yang paling tepat untuk mengatasi permasalahan tersebut?", "o": ["Memberikan bantuan keuangan rutin kepada lulusan muda hingga mendapat pekerjaan tetap.", "Menurunkan batas usia minimum bekerja agar remaja dapat memasuki dunia kerja lebih awal.", "Mewajibkan perusahaan swasta mempekerjakan lulusan muda tanpa persyaratan memiliki pengalaman kerja.", "Membangun lebih banyak industri padat karya di daerah dengan tingkat pengangguran muda yang tinggi.", "Menyediakan pelatihan keterampilan di bidang kewirausahaan industri melalui integrasi dalam sistem pendidikan."], "k": 4, "e": "Masalahnya adalah ketidaksesuaian keterampilan lulusan muda dengan kebutuhan dunia kerja. Solusi yang menyentuh akar masalah adalah pelatihan keterampilan, termasuk kewirausahaan, yang diintegrasikan dalam sistem pendidikan. Bantuan keuangan rutin (A) tidak mendidik, menurunkan usia minimum bekerja (B) melanggar aturan, mewajibkan perusahaan menerima tanpa syarat (C) tidak realistis, dan industri padat karya (D) tidak otomatis menjawab kesenjangan keterampilan."}, {"t": "pg", "q": "Pada kuartal pertama tahun ini, Badan Pusat Statistik (BPS) mencatat lonjakan harga pada sejumlah bahan pokok seperti beras, minyak goreng, telur ayam, dan cabai rawit di berbagai daerah di Indonesia. Kenaikan harga ini terjadi menjelang bulan Ramadan, di mana konsumsi masyarakat meningkat pesat. Di sisi lain, hasil panen beberapa komoditas menurun akibat curah hujan yang sangat tinggi dan banjir di sejumlah sentra pertanian.\n\nBerdasarkan ilustrasi tersebut, faktor utama yang menyebabkan inflasi adalah ....", "o": ["melemahnya nilai tukar Rupiah terhadap dolar Amerika Serikat", "kenaikan upah buruh dan harga bahan baku industri", "peningkatan biaya distribusi karena kenaikan harga Bahan Bakar Minyak (BBM)", "penurunan produksi akibat perpindahan tenaga kerja ke sektor jasa", "peningkatan permintaan barang yang lebih cepat dari pasokannya"], "k": 4, "e": "Harga naik menjelang Ramadan karena konsumsi meningkat pesat (permintaan naik), sementara panen menurun akibat banjir dan curah hujan tinggi (pasokan turun). Permintaan yang tumbuh lebih cepat daripada pasokan adalah penyebab utama inflasi pada ilustrasi ini. Faktor kurs, upah, BBM, dan perpindahan tenaga kerja tidak disebutkan dalam teks."}, {"t": "pg", "q": "Perhatikan data harga bahan pokok di daerah Adidaya berikut ini.", "d": {"h": 1, "r": [["Nama barang", "Harga barang (Rp) Tahun 2024", "Harga barang (Rp) Tahun 2025"], ["Daging ayam (Kg)", "40.000", "45.000"], ["Telur (Kg)", "24.000", "26.000"], ["Gula (Kg)", "22.000", "25.000"], ["Cabai merah (Kg)", "14.000", "19.000"]]}, "q2": "Besarnya nilai Indeks Harga Konsumen (IHK) tahun 2025 dengan metode agregatif sederhana adalah ....", "o": ["115%", "111,62%", "110%", "95,6%", "90,9%"], "k": 0, "e": "Indeks harga konsumen dengan metode agregatif sederhana:\nIHK = (ΣPn / ΣP0) × 100%\nΣP2025 = 45.000 + 26.000 + 25.000 + 19.000 = 115.000\nΣP2024 = 40.000 + 24.000 + 22.000 + 14.000 = 100.000\nIHK = 115.000 / 100.000 × 100% = 115%"}, {"t": "pg", "q": "Perhatikan data Indeks Harga Konsumen (IHK) berikut, berdasarkan tiga sektor dalam empat periode. Dengan tahun 2022 sebagai indeks harga tahun dasar.", "d": {"h": 1, "r": [["Tahun", "Sektor Pariwisata", "Sektor Transportasi", "Sektor Kesehatan"], ["2022", "100", "100", "100"], ["2023", "110", "107", "109"], ["2024", "112", "115", "114"], ["2025", "117", "116", "118"]]}, "q2": "Berdasarkan tabel tersebut, manakah sektor yang paling berdampak terhadap tingkat inflasi?", "o": ["Sektor pariwisata memberikan dampak tertinggi terhadap inflasi karena mengalami kenaikan IHK sebesar 17% selama periode 2022–2025.", "Sektor transportasi menjadi penyumbang inflasi terbesar karena memiliki lonjakan indeks paling tajam pada tahun 2024.", "Kenaikan indeks sektor kesehatan relatif rendah, sehingga tidak signifikan terhadap inflasi nasional.", "Semua sektor mengalami kenaikan IHK yang sama, sehingga dampaknya terhadap inflasi dianggap setara.", "Sektor kesehatan memberikan dampak terbesar karena mengalami kenaikan indeks harga tertinggi selama periode 2022–2025."], "k": 4, "e": "Kenaikan IHK 2022–2025 (tahun dasar 100): pariwisata 117 (naik 17%), transportasi 116 (naik 16%), kesehatan 118 (naik 18%). Kenaikan tertinggi dialami sektor kesehatan sehingga sektor inilah yang paling berdampak terhadap inflasi.\nOpsi (A) keliru karena 17% bukan yang tertinggi. Opsi (B) hanya melihat lonjakan 2024, bukan keseluruhan periode. Opsi (C) dan (D) keliru karena kenaikan antarsektor berbeda dan sektor kesehatan justru tertinggi."}, {"t": "mc", "q": "Bank Sentral bertanggung jawab agar keuangan suatu negara tetap stabil. Berikut ini mana yang merupakan peran dan fungsi Bank Indonesia?", "o": ["Mengatur suku bunga acuan untuk mengendalikan inflasi", "Menyediakan layanan giro, tabungan, dan deposito untuk masyarakat", "Mengawasi kelancaran sistem pembayaran nasional", "Menyalurkan kredit langsung kepada pelaku usaha kecil", "Menjaga stabilitas sistem keuangan nasional"], "k": [0, 2, 4], "e": "1. Benar – BI menetapkan BI Rate sebagai suku bunga acuan untuk mengendalikan inflasi.\n2. Salah – layanan giro, tabungan, dan deposito untuk masyarakat diberikan bank umum, bukan Bank Indonesia.\n3. Benar – BI mengatur dan mengawasi kelancaran sistem pembayaran nasional.\n4. Salah – penyaluran kredit langsung kepada pelaku usaha kecil dilakukan bank umum dan lembaga keuangan, bukan BI.\n5. Benar – BI menjaga stabilitas sistem keuangan sebagai bagian dari tugasnya."}, {"t": "mc", "q": "Di Indonesia, momen Hari Raya telah menjadi bagian penting dari siklus ekonomi tahunan. Pada periode ini, terjadi peningkatan aktivitas ekonomi masyarakat yang ditandai dengan percepatan peredaran uang dan peningkatan konsumsi rumah tangga. Efek kenaikan upah dari THR (Tunjangan Hari Raya) mendorong peningkatan konsumsi yang kemudian berimbas pada kenaikan harga. Hari Raya juga identik dengan meningkatnya belanja di kalangan masyarakat. Hampir setiap rumah tangga mengalokasikan anggaran konsumsi untuk berbagai hal. Berbagai aktivitas masyarakat di masa Lebaran ini terpotret dari arus perputaran uang yang lebih cepat dibandingkan dengan hari biasa sehingga memicu terjadinya inflasi.\n\nBerdasarkan ilustrasi tersebut, kebijakan moneter apa yang sesuai untuk mengantisipasi kondisi tersebut? Klik semua jawaban benar! Jawaban benar lebih dari satu.", "o": ["Menaikkan suku bunga simpanan untuk mendorong peningkatan tabungan masyarakat di perbankan.", "Menjual surat berharga untuk menarik dana masyarakat dan mendukung pembiayaan fiskal.", "Menurunkan suku bunga simpanan guna mengalihkan preferensi masyarakat dari menabung ke investasi.", "Melonggarkan kebijakan kredit untuk meningkatkan akses pembiayaan bagi sektor rumah tangga dan industri.", "Menurunkan rasio cadangan wajib minimum (reserve requirement) agar bank memiliki ruang likuiditas lebih besar untuk menyalurkan kredit dan investasi."], "k": [0, 1], "e": "Kondisi: inflasi akibat konsumsi dan peredaran uang meningkat. Kebijakan moneter yang tepat adalah kontraktif untuk mengurangi uang beredar.\n1. Benar – menaikkan suku bunga simpanan mendorong masyarakat menabung sehingga uang beredar berkurang.\n2. Benar – menjual surat berharga (operasi pasar terbuka) menarik uang dari masyarakat.\n3. Salah – menurunkan suku bunga simpanan mendorong belanja, itu kebijakan ekspansif.\n4. Salah – melonggarkan kredit menambah uang beredar, itu kebijakan ekspansif.\n5. Salah – menurunkan rasio cadangan wajib minimum menambah likuiditas bank, itu kebijakan ekspansif."}, {"t": "mc", "q": "Pertumbuhan ekonomi Indonesia pada kuartal I-2025 hanya mencapai 4,87%, mengalami penurunan dibanding kuartal-kuartal sebelumnya. Penurunan ini terutama disebabkan oleh lesunya konsumsi rumah tangga, yang hanya tumbuh 4,89% (YOY), meskipun kontribusinya terhadap PDB masih sangat besar, yaitu sekitar 54,53%. Penurunan konsumsi ini erat kaitannya dengan melemahnya daya beli dan penyusutan kelas menengah dari 57,33 juta orang pada 2019 menjadi hanya 47,85 juta orang pada 2024. Untuk merespons situasi tersebut, Bank Indonesia (BI) mengambil langkah menurunkan rasio Cadangan Wajib Minimum (GWM).\n\nManakah pernyataan berikut yang tepat menggambarkan konsekuensi dan efektivitas dari kebijakan tersebut? Klik semua jawaban benar! Jawaban benar lebih dari satu.", "o": ["Langkah yang diambil BI dapat memperluas ruang likuiditas perbankan sehingga memperkuat kemampuan pembiayaan terhadap konsumsi rumah tangga.", "Kebijakan yang dilakukan BI berisiko gagal meningkatkan konsumsi jika tidak dibarengi dengan perbaikan sisi permintaan seperti kenaikan pendapatan riil Masyarakat.", "Kebijakan yang dilakukan BI dapat menjadi sinyal ekspansi moneter, namun dampaknya terbatas bila perbankan memilih menahan kredit karena kehati-hatian terhadap risiko gagal bayar.", "Langkah BI ini akan secara otomatis meningkatkan konsumsi karena dana murah akan terserap langsung oleh rumah tangga menengah bawah.", "Kebijakan yang diambil BI dengan pengawasan alokasi kredit dapat membuat dana justru terserap ke sektor spekulatif seperti aset finansial dan property."], "k": [0, 1, 2, 4], "e": "Penurunan GWM adalah kebijakan moneter ekspansif karena menambah likuiditas bank untuk disalurkan sebagai kredit.\n1. Benar – ruang likuiditas bank meluas sehingga kemampuan pembiayaan, termasuk untuk konsumsi, menguat.\n2. Benar – jika daya beli dan pendapatan riil tidak membaik, permintaan kredit tetap lemah dan konsumsi tidak naik.\n3. Benar – ini sinyal ekspansi, tetapi bank bisa menahan kredit karena takut gagal bayar sehingga dampaknya terbatas.\n4. Salah – kata “secara otomatis” tidak tepat karena penyaluran dan penyerapan kredit bergantung pada bank dan rumah tangga.\n5. Benar – risiko dana mengalir ke sektor spekulatif (aset finansial dan properti) memang ada pada kebijakan pelonggaran likuiditas.\nCatatan: Pada pernyataan 5, kata “dengan pengawasan alokasi kredit” kemungkinan dimaksudkan “tanpa pengawasan alokasi kredit”. Kunci mengikuti maksud tersebut. Sebaiknya redaksinya diperbaiki agar tidak menimbulkan tafsir ganda."}, {"t": "pg", "q": "Rokok, minuman beralkohol, dan kendaraan berbahan bakar fosil merupakan barang yang dikategorikan sebagai demerit goods karena dapat membahayakan kesehatan. Oleh karena, pemerintah menerapkan kebijakan fungsi regulasi pajak, yakni menaikkan tarif pajak atas produk-produk yang memiliki eksternalitas negatif. Sebagai pelengkap, pemerintah juga memberikan insentif pajak kepada industri yang mengembangkan alternatif ramah lingkungan seperti kendaraan listrik dan produk substitusi non-alkohol.\n\nBerdasarkan ilustrasi tersebut, dampak yang paling tepat dari penerapan fungsi regulasi pajak adalah....", "o": ["terhambatnya ekspansi industri berbasis energi fosil akibat insentif yang tidak merata", "perubahan preferensi konsumsi masyarakat menuju barang yang lebih sehat dan ramah lingkungan", "meningkatnya ketergantungan fiskal terhadap sektor barang dengan dampak eksternalitas tinggi", "penurunan pendapatan masyarakat akibat meningkatnya harga barang konsumsi umum", "peningkatan keuntungan produsen barang substitusi sebagai akibat dari kenaikan permintaan"], "k": 1, "e": "Pajak yang tinggi pada barang demerit (rokok, alkohol, kendaraan berbahan bakar fosil) disertai insentif bagi alternatif ramah lingkungan menjalankan fungsi regulasi, yaitu mengatur perilaku. Dampak yang paling tepat adalah bergesernya preferensi konsumsi masyarakat ke barang yang lebih sehat dan ramah lingkungan. Opsi lain menggambarkan dampak yang bukan tujuan utama fungsi regulasi atau tidak didukung ilustrasi."}, {"t": "mc", "q": "Pak Andi seorang karyawan swasta. Gaji bulanannya dipotong secara otomatis untuk membayar Pajak Penghasilan (PPh) Pasal 21, yang disetorkan oleh perusahaannya ke kas negara. Ia memiliki Nomor Pokok Wajib Pajak (NPWP) dan rutin melaporkan SPT Tahunan secara online. Sedangkan Ibu Rani seorang pemilik toko kelontong. Ia menjual barang-barang kebutuhan rumah tangga dan secara berkala menyetorkan Pajak Pertambahan Nilai (PPN) atas penjualannya serta membayar PPh Final UMKM. Uang pajak yang disetorkan oleh Pak Andi dan Ibu Rani digunakan untuk membangun fasilitas umum seperti puskesmas dan sekolah, serta membayar gaji pegawai Aparatur Sipil Negara (ASN).\n\nBerdasarkan ilustrasi tersebut, manakah pernyataan berikut yang benar terkait jenis pajak, peran, fungsi, dan prinsip pajak? Tentukan jawaban yang benar. Jawaban benar lebih dari satu.", "o": ["Pak Andi membayar pajak langsung, sedangkan Ibu Rani membayar pajak tidak langsung. Keduanya menerapkan prinsip kemudahan dalam pembayaran pajak.", "Pajak yang dibayarkan keduanya menunjukkan penerapan fungsi budgeter karena uang pajak digunakan untuk membiayai pengeluaran negara.", "Pak Andi membayar pajak tidak langsung dengan prinsip kemudahan, sedangkan Ibu Rani membayar pajak langsung dengan prinsip efisiensi karena rendahnya biaya yang dikeluarkan untuk membayar pajak.", "Pajak yang dibayarkan keduanya menunjukkan penerapan fungsi distribusi karena uang yang diterima pemerintah dialokasikan ke berbagai sektor pembangunan dan perluasan lapangan pekerjaan.", "Pak Andi dan Ibu Rani membayar pajak langsung dengan prinsip keadilan karena besarnya jumlah pajak yang dibayarkan keduanya sama tanpa memperhatikan objek pajaknya."], "k": [0, 1], "e": "1. Benar – PPh Pasal 21 Pak Andi adalah pajak langsung, PPN Ibu Rani adalah pajak tidak langsung. Pemotongan otomatis, pelaporan SPT online, dan penyetoran berkala menunjukkan prinsip kemudahan (convenience).\n2. Benar – uang pajak dipakai membiayai pengeluaran negara (fasilitas umum dan gaji ASN), itulah fungsi budgeter.\n3. Salah – PPh Pasal 21 Pak Andi adalah pajak langsung, bukan tidak langsung.\n4. Salah – penggunaan pajak untuk pembangunan dan belanja negara adalah fungsi budgeter/alokasi. Fungsi distribusi (redistribusi) berkaitan dengan pemerataan pendapatan.\n5. Salah – Ibu Rani membayar PPN yang merupakan pajak tidak langsung, dan prinsip keadilan berarti beban pajak sebanding dengan kemampuan, bukan jumlah yang sama."}, {"t": "mc", "q": "Taliukir adalah sebuah perusahaan yang bergerak di bidang kerajinan tangan berbahan dasar kulit, seperti tas, dompet, dan sabuk. CV. Taliukir sangat mengutamakan kualitas produk yang dibuat secara tradisional, sehingga setiap produk memiliki sentuhan unik dan nilai seni tinggi. Produk mereka beredar di pasar menengah atas dan turis. Meskipun produknya berkualitas, CV. Taliukir kesulitan mendapatkan modal besar untuk mengembangkan usaha, seperti membeli mesin modern untuk efisiensi produksi massal atau membuka cabang di kota besar. Selain itu pasokan kulit berkualitas tinggi mulai langka dan harganya terus naik. Hal ini disebabkan semakin ketatnya regulasi lingkungan yang membatasi industri penyamakan kulit dan peningkatan permintaan dari industri fesyen global. Solusi yang bisa dilakukan untuk mengatasi permasalahan tersebut yaitu ....", "o": ["menghentikan produksi kerajinan kulit dan beralih ke kerajinan dengan bahan baku lain yang lebih mudah didapat.", "membentuk kerjasama dengan peternak sapi atau industri pengolahan kulit mentah untuk memastikan pasokan kulit, dan mencari investor dengan skema bagi hasil.", "menimbun kulit berkualitas tinggi dalam jumlah besar saat tersedia, meskipun harganya mahal, dan mengajukan pinjaman bank dengan agunan aset pribadi pemilik CV.", "berinvestasi dalam riset dan pengembangan untuk menemukan bahan kulit sintetis berkualitas tinggi yang menyerupai kulit asli.", "mengurangi standar kualitas produk agar bisa menggunakan bahan baku kulit dengan kualitas lebih rendah dan biaya produksi lebih murah."], "k": [1, 3], "e": "1. Salah – beralih ke bahan lain berarti meninggalkan keunggulan kerajinan kulit tradisional, bukan solusi.\n2. Benar – kerja sama pasokan dengan peternak atau industri pengolahan kulit dan investor bagi hasil menjawab masalah bahan baku dan modal.\n3. Salah – menimbun bahan mahal dan menjaminkan aset pribadi berisiko tinggi serta tidak sehat secara bisnis.\n4. Benar – riset bahan kulit sintetis berkualitas tinggi adalah solusi jangka panjang atas kelangkaan bahan dan regulasi lingkungan.\n5. Salah – menurunkan standar kualitas merusak nilai jual produk yang berpasar menengah atas."}, {"t": "pg", "q": "CV Surya Karya, sebuah badan usaha jasa interior, menghadapi masalah keuangan dalam tiga bulan terakhir. Meski pendapatan meningkat karena banyaknya proyek, perusahaan justru mengalami kesulitan membayar gaji karyawan dan tagihan vendor tepat waktu. Setelah dilakukan penelusuran, diketahui bahwa manajer keuangan sering menggunakan dana masuk untuk membayar utang lama tanpa membuat perencanaan arus kas yang jelas. Selain itu, tidak ada pemisahan dana antara proyek satu dengan proyek lainnya, sehingga dana dari satu proyek sering digunakan untuk kebutuhan proyek lain. Akibatnya, banyak pengeluaran tidak terkontrol dan laporan keuangan sulit disusun secara akurat.\n\nBerdasarkan uraian tersebut, solusi yang paling tepat untuk mengatasi permasalahan manajemen keuangan yang terjadi adalah...", "o": ["menambah jumlah staf administrasi keuangan agar pengelolaan dana lebih terdistribusi.", "mengajukan pinjaman jangka pendek ke bank agar kebutuhan operasional segera terpenuhi.", "meningkatkan pemasaran agar pemasukan lebih besar dan menutupi kekurangan kas.", "menyusun sistem pengelolaan arus kas yang terencana dan pemisahan dana untuk setiap proyek.", "mengurangi proyek yang dikerjakan agar fokus pengelolaan keuangan tidak tersebar."], "k": 3, "e": "Akar masalahnya adalah manajemen keuangan yang buruk: tidak ada perencanaan arus kas dan dana antarproyek bercampur. Solusi paling tepat adalah menyusun sistem pengelolaan arus kas terencana dan memisahkan dana tiap proyek. Menambah staf (A), pinjaman jangka pendek (B), pemasaran (C), dan mengurangi proyek (E) tidak memperbaiki penyebab utamanya."}, {"t": "pg", "q": "Perhatikan data laporan keuangan Koperasi Kilau Gemitang berikut ini.", "d": {"h": 0, "r": [["Jumlah Simpanan anggota", "Rp80.000.000,00"], ["Jumlah penjualan selama satu tahun", "Rp250.000.000,00"], ["SHU tahun berjalan", "Rp200.000.000,00"], ["Jasa usaha", "50%"], ["Jasa modal", "30%"], ["Jasa pengurus", "15%"], ["Dana lain-lain", "5%"]]}, "q2": "Berdasarkan data tersebut, jika jumlah pengurus koperasi sebanyak 20 orang, dan Pak Faiz merupakan salah satu pengurus dengan total simpanan Rp1.000.000,00 serta transaksi penjualan Rp2.000.000,00, maka total SHU yang diterima pak Faiz pada akhir tahun 2025 adalah ....", "o": ["Rp4.550.000,00", "Rp3.400.000,00", "Rp3.230.000,00", "Rp3.050.000,00", "Rp3.000.000,00"], "k": 3, "e": "SHU yang diterima Pak Faiz terdiri atas jasa usaha, jasa modal, dan jasa pengurus:\nJasa usaha   = 50% × 200.000.000 = 100.000.000\n               2.000.000 / 250.000.000 × 100.000.000 = 800.000\nJasa modal   = 30% × 200.000.000 = 60.000.000\n               1.000.000 / 80.000.000 × 60.000.000 = 750.000\nJasa pengurus= 15% × 200.000.000 = 30.000.000\n               30.000.000 / 20 pengurus = 1.500.000\nTotal SHU Pak Faiz = 800.000 + 750.000 + 1.500.000 = Rp3.050.000"}, {"t": "pg", "q": "Beberapa negara di Asia Tenggara termasuk Indonesia membentuk sebuah organisasi yang bertujuan mempererat hubungan politik, ekonomi, dan sosial di kawasan mereka. Sementara itu, Indonesia juga menjalin perjanjian perdagangan barang dan jasa dengan Korea Selatan yang hanya melibatkan kedua negara tersebut. Di sisi lain, ada organisasi global yang anggotanya berasal dari berbagai negara di seluruh dunia yang fokus pada masalah perdagangan internasional.\n\nBerdasarkan ilustrasi tersebut, apa jenis kerja sama internasional yang tepat?", "o": ["Kerja sama bilateral untuk ASEAN, kerja sama regional untuk perjanjian Indonesia-Korea, dan kerja sama multilateral untuk organisasi perdagangan global.", "Kerja sama multilateral untuk ASEAN, kerja sama bilateral untuk perjanjian Indonesia-Korea, dan kerja sama multilateral untuk organisasi perdagangan global.", "Kerja sama regional untuk ASEAN, kerja sama multilateral untuk perjanjian Indonesia-Korea, dan kerja sama bilateral untuk organisasi perdagangan global.", "Kerja sama bilateral untuk ASEAN, kerja sama multilateral untuk perjanjian Indonesia-Korea, dan kerja sama regional untuk organisasi perdagangan global.", "Kerja sama regional untuk ASEAN, kerja sama bilateral untuk perjanjian Indonesia-Korea, dan kerja sama multilateral untuk organisasi perdagangan global."], "k": 4, "e": "ASEAN beranggotakan negara-negara satu kawasan sehingga merupakan kerja sama regional. Perjanjian Indonesia–Korea Selatan hanya melibatkan dua negara sehingga bilateral. Organisasi perdagangan global dengan anggota dari seluruh dunia (misalnya WTO) adalah kerja sama multilateral."}, {"t": "pg", "q": "Selama beberapa tahun terakhir, Negara X mengalami defisit neraca perdagangan yang semakin memburuk. Sebagai negara berkembang, negara X bergantung pada ekspor sumber daya alam seperti kelapa sawit, batubara, dan karet. Nilai ekspor negara tersebut stagnan bahkan cenderung mengalami penurunan karena rendahnya kualitas dan inovasi produk domestik. Rendahnya nilai ekspor juga dipengaruhi oleh tingginya biaya logistik sehingga menyebabkan harga produk ekspor menjadi tinggi. Di sisi lain, negara X juga dibanjiri produk impor. Tingginya volume impor barang konsumsi seperti tekstil dan makanan olahan menyebabkan produk lokal kehilangan daya saing. Sementara itu, Pemerintah ingin mengambil kebijakan perdagangan internasional yang tepat untuk menyeimbangkan kembali kondisi tersebut dan melindungi industri nasional.\n\nBerdasarkan ilustrasi tersebut, manakah kebijakan perdagangan internasional yang paling tepat untuk mengatasi permasalahan Negara X?", "o": ["Meningkatkan kuota impor barang konsumsi agar harga barang di dalam negeri lebih stabil dan tercukupinya kebutuhan masyarakat.", "Menghapus semua hambatan perdagangan agar negara lebih terbuka terhadap investasi asing, sehingga terciptanya lapangan pekerjaan.", "Memberikan subsidi dan insentif kepada industri lokal serta melakukan diversifikasi produk agar lebih kompetitif di pasar global.", "Menurunkan nilai tukar mata uang secara drastis untuk mendorong ekspor, sehingga neraca perdagangan kembali surplus.", "Menurunkan tarif impor agar masyarakat menikmati barang konsumsi impor dengan harga murah sehingga daya beli masyarakat meningkat."], "k": 2, "e": "Negara X mengalami defisit neraca perdagangan, ekspor lemah akibat kualitas dan inovasi rendah, dan produk lokal kalah oleh impor. Kebijakan yang tepat adalah memperkuat daya saing industri lokal lewat subsidi, insentif, dan diversifikasi produk. Opsi (A), (B), dan (E) membuka impor sehingga memperburuk industri nasional, sedangkan (D) devaluasi drastis berisiko menimbulkan inflasi dan beban utang luar negeri."}, {"t": "mc", "q": "Pada Oktober 2023, American Shrimp Processors Association (ASPA) mengajukan petisi kepada Departemen Perdagangan Amerika Serikat (USDOC) dan Komisi Perdagangan Internasional Amerika Serikat (USITC). Petisi tersebut menuduh bahwa Indonesia melakukan praktik dumping dan menerima subsidi tidak adil dalam ekspor udang tropis beku, yang dianggap merugikan industri udang lokal di Amerika Serikat. Akibat tuduhan ini, ekspor udang Indonesia menghadapi risiko dikenai bea masuk anti-dumping dan countervailing duty (tarif subsidi). Jika tuduhan tersebut berlanjut dan pemerintah Amerika Serikat mengenakan bea masuk tambahan terhadap udang Indonesia.\n\nManakah yang merupakan dampak logis terhadap daya saing ekspor udang Indonesia ke Amerika Serikat?", "o": ["Harga jual udang Indonesia menjadi lebih rendah di pasar Amerika Serikat dibandingkan pesaing seperti India atau Ekuador.", "Dapat menurunkan kepercayaan pembeli dan mencoreng reputasi produk perikanan Indonesia di pasar global.", "Eksportir Indonesia harus meningkatkan sertifikasi perdagangan untuk menghindari diskriminasi tarif di masa mendatang.", "Dapat menjadi peluang bagi Indonesia untuk mendominasi pasar udang beku karena dianggap memiliki harga yang kompetitif.", "Dapat memicu negara tujuan lain untuk melakukan penyelidikan serupa terhadap produk ekspor Indonesia."], "k": [1, 2, 4], "e": "1. Salah – bea masuk tambahan menaikkan harga udang Indonesia di pasar AS sehingga lebih mahal dibanding pesaing, bukan lebih murah.\n2. Benar – tuduhan dumping dan subsidi dapat menurunkan kepercayaan pembeli dan merusak reputasi.\n3. Benar – eksportir perlu memperkuat sertifikasi dan kepatuhan agar terhindar dari hambatan tarif berikutnya.\n4. Salah – tarif tambahan melemahkan daya saing harga, bukan membuka peluang mendominasi pasar.\n5. Benar – negara tujuan lain bisa terdorong melakukan penyelidikan serupa."}, {"t": "mc", "q": "Perhatikan beberapa transaksi keuangan berikut yang terjadi di PT Solusi Jasa Mandiri bergerak di perusahaan jasa konsultan teknologi:\n\nDiterima pembayaran tunai sebesar Rp10.000.000,00 dari klien atas jasa yang telah diberikan.\n\nDibayar sewa kantor untuk 3 bulan ke depan sebesar Rp6.000.000,00 secara tunai.\n\nMembeli peralatan kantor senilai Rp12.000.000,00 secara kredit.\n\nPemilik menambahkan investasi pribadi ke dalam perusahaan sebesar Rp15.000.000,00 melalui rekening bank perusahaan.\n\nMenerima tagihan listrik bulan ini sebesar Rp800.000,00 yang belum dibayar.\n\nBerdasarkan transaksi tersebut, manakah yang menyebabkan perubahan pada aset maupun kewajiban dalam persamaan dasar akuntansi? Klik pada semua jawaban yang benar! Jawaban benar lebih dari satu.", "o": ["Transaksi 1", "Transaksi 2", "Transaksi 3", "Transaksi 4", "Transaksi 5"], "k": [0, 2, 3, 4], "e": "Persamaan dasar akuntansi: Aset = Kewajiban + Modal. Pengaruh tiap transaksi:\n1. Benar – kas bertambah Rp10.000.000 dan pendapatan (modal) bertambah, sehingga aset berubah.\n2. Salah – kas berkurang Rp6.000.000 dan sewa dibayar dimuka bertambah Rp6.000.000; hanya komposisi aset yang berubah, total aset dan kewajiban tetap.\n3. Benar – peralatan (aset) bertambah Rp12.000.000 dan utang (kewajiban) bertambah Rp12.000.000.\n4. Benar – kas (aset) bertambah Rp15.000.000 dan modal bertambah Rp15.000.000.\n5. Benar – utang listrik (kewajiban) bertambah Rp800.000 dan beban mengurangi modal.\nCatatan: Soal ditafsirkan sebagai “perubahan pada aset atau kewajiban”. Jika “aset maupun kewajiban” dimaksudkan harus keduanya berubah, hanya transaksi 3 yang memenuhi."}, {"t": "pg", "q": "Data keuangan Bengkel Tuan Akhtar periode Desember 2024 sebagai berikut:\n\nKas Rp10.000.000,00\n\nPiutang Rp7.000.000,00\n\nSewa dibayar dimuka Rp6.000.000,00\n\nPeralatan Rp8.500.000,00\n\nUtang usaha Rp8.000.000,00\n\nModal Rp23.500.000,00.\n\nApabila perusahaan membayar utang sebesar Rp2.000.000,00 dan biaya bunga sebesar Rp50.000,00 maka perubahan persamaan dasar akuntansi yang benar adalah ....", "o": ["harta berkurang menjadi Rp23.450.000,00, utang berkurang menjadi Rp6.000.000,00, dan modal bertambah menjadi Rp29.450.000,00", "harta berkurang menjadi Rp29.450.000,00, utang berkurang menjadi Rp6.000.000,00, dan modal berkurang menjadi Rp23.450.000,00", "harta berkurang menjadi Rp29.500.000,00, utang berkurang menjadi Rp6.000.000,00, dan modal tetap sebesar Rp23.500.000,00", "harta bertambah menjadi Rp31.500.000,00, utang bertambah menjadi Rp8.000.000,00, dan modal tetap sebesar Rp23.500.000,00", "harta bertambah menjadi Rp33.550.000,00, utang bertambah menjadi Rp10.000.000,00, dan modal bertambah menjadi Rp23.550.000,00"], "k": 1, "e": "Kondisi awal: aset = 10.000.000 + 7.000.000 + 6.000.000 + 8.500.000 = Rp31.500.000; utang Rp8.000.000; modal Rp23.500.000.\nBayar utang Rp2.000.000   : kas − 2.000.000, utang − 2.000.000\nBiaya bunga Rp50.000      : kas − 50.000, modal − 50.000\nHarta = 31.500.000 − 2.000.000 − 50.000 = 29.450.000\nUtang = 8.000.000 − 2.000.000 = 6.000.000\nModal = 23.500.000 − 50.000 = 23.450.000\nPersamaan seimbang: 29.450.000 = 6.000.000 + 23.450.000. Jadi harta, utang, dan modal semuanya berkurang (opsi B).\nCatatan: Hasil ini memakai biaya bunga Rp50.000,00 sesuai soal. Pada Paket 2 tertulis Rp50.000.000,00; angka itu akan membuat modal menjadi negatif sehingga kemungkinan salah ketik."}, {"t": "pg", "q": "Diketahui data keuangan rental kendaraan “Sat Set” pada bulan Desember 2024 sebagai berikut!", "d": {"h": 1, "r": [["Akun", "Jumlah"], ["Pendapatan operasional", "Rp93.000.000,00"], ["Pendapatan non operasional", "Rp300.000,00"], ["Beban operasional", "Rp17.950.000,00"], ["Beban non operasional", "Rp3.050.000,00"], ["Prive", "Rp2.500.000,00"], ["Modal akhir", "Rp195.000.000,00"]]}, "q2": "Berdasarkan data tersebut, besarnya modal awal adalah ....", "o": ["Rp120.200.000,00", "Rp122.700.000,00", "Rp125.200.000,00", "Rp267.300.000,00", "Rp269.800.000,00"], "k": 2, "e": "Modal akhir = modal awal + laba bersih − prive.\nPendapatan total = 93.000.000 + 300.000 = 93.300.000\nBeban total      = 17.950.000 + 3.050.000 = 21.000.000\nLaba bersih      = 93.300.000 − 21.000.000 = 72.300.000\n195.000.000 = Modal awal + 72.300.000 − 2.500.000\nModal awal = 195.000.000 − 72.300.000 + 2.500.000 = Rp125.200.000"}];
const Q2=[{"t": "pg", "q": "Harga pupuk melonjak dan pasokannya terbatas sehingga petani kesulitan memenuhi kebutuhan. Langkah paling tepat sesuai prinsip ekonomi untuk mengatasi kelangkaan tersebut adalah ....", "o": ["Menimbun pupuk saat harga masih rendah agar dijual kembali.", "Kelompok tani membeli pupuk secara bersama-sama dan memakai pupuk organik secara efisien.", "Menghentikan seluruh kegiatan pertanian sampai harga pupuk turun.", "Memakai pupuk sebanyak-banyaknya agar hasil panen melimpah.", "Meminta pemerintah mengimpor pupuk tanpa batas jumlah."], "k": 1, "e": "Kelangkaan diatasi dengan penggunaan sumber daya secara efisien dan mencari alternatif. Membeli bersama dan memakai pupuk organik menekan biaya tanpa menghabiskan sumber daya. Menimbun, berhenti bertani, atau memakai pupuk berlebihan justru memperburuk kelangkaan."}, {"t": "pg", "q": "Dina baru lulus SMA dan menghadapi tiga pilihan: bekerja sebagai kasir dengan gaji Rp4.000.000 per bulan, kuliah dengan beasiswa dan uang saku Rp1.500.000 per bulan, atau membuka usaha online dengan perkiraan laba Rp3.000.000 per bulan.\n\nJika Dina memilih kuliah dengan beasiswa, berapakah biaya peluang yang dikorbankannya?", "o": ["Rp8.500.000", "Rp4.000.000", "Rp3.000.000", "Rp1.500.000", "Rp7.000.000"], "k": 1, "e": "Biaya peluang adalah nilai alternatif terbaik yang dikorbankan. Alternatif lain bernilai Rp4.000.000 (kasir) dan Rp3.000.000 (usaha), sehingga yang terbaik dan dikorbankan adalah Rp4.000.000."}, {"t": "pg", "q": "Toko roti \"Manis Rasa\" mengalami kenaikan harga tepung. Pemilik tidak ingin menurunkan kualitas rotinya. Tindakan yang paling tepat sesuai prinsip ekonomi adalah ....", "o": ["Mengganti dengan tepung berkualitas rendah agar harga roti tetap.", "Menghentikan produksi sampai harga tepung kembali normal.", "Mencari pemasok tepung berkualitas sama dengan harga lebih murah.", "Menaikkan harga roti dua kali lipat.", "Mengurangi ukuran roti sangat jauh tanpa pemberitahuan."], "k": 2, "e": "Prinsip ekonomi: pengorbanan sekecil-kecilnya untuk hasil sebaik-baiknya. Mencari pemasok yang lebih murah dengan kualitas sama menekan biaya tanpa mengorbankan kualitas dan kepercayaan pelanggan."}, {"t": "pg", "q": "Pemerintah memberikan subsidi pupuk kepada petani padi. Kebijakan tersebut akan berdampak pada keseimbangan pasar beras, yaitu ....", "o": ["harga naik dan jumlah barang tetap", "harga naik dan jumlah barang turun", "harga naik dan jumlah barang naik", "harga turun dan jumlah barang naik", "harga turun dan jumlah barang turun"], "k": 3, "e": "Subsidi pupuk menurunkan biaya produksi sehingga penawaran naik (kurva penawaran bergeser ke kanan). Akibatnya harga keseimbangan turun dan jumlah barang naik."}, {"t": "pg", "q": "Pasar beras memiliki fungsi permintaan Qd = 1.000 − 20P dan fungsi penawaran Qs = −200 + 40P. Titik keseimbangan pasar beras adalah ....", "o": ["P = 20 dan Q = 600", "P = 15 dan Q = 700", "P = 25 dan Q = 500", "P = 30 dan Q = 400", "P = 10 dan Q = 800"], "k": 0, "e": "Keseimbangan: Qd = Qs\n1.000 − 20P = −200 + 40P\n1.200 = 60P → P = 20\nQ = 1.000 − 20(20) = 600"}, {"t": "mc", "q": "Harga beras per kilogram tidak berubah, tetapi kurva permintaan beras bergeser ke kanan. Manakah faktor berikut yang dapat menyebabkannya?", "o": ["Pendapatan masyarakat meningkat.", "Harga jagung (barang substitusi beras) naik.", "Jumlah penduduk bertambah.", "Harga beras itu sendiri turun.", "Harga lauk pauk (barang komplemen) naik."], "k": [0, 1, 2], "e": "Kenaikan pendapatan (beras barang normal), kenaikan harga barang substitusi, dan pertambahan penduduk menaikkan permintaan sehingga kurva bergeser ke kanan. Harga beras sendiri hanya menggerakkan titik sepanjang kurva, dan kenaikan harga barang komplemen justru menurunkan permintaan (kurva ke kiri)."}, {"t": "pg", "q": "Ketika harga sebuah barang naik dari Rp10.000 menjadi Rp12.000, jumlah barang yang diminta turun dari 100 unit menjadi 80 unit. Koefisien elastisitas permintaan barang tersebut menunjukkan permintaan bersifat ....", "o": ["elastis", "inelastis", "uniter (elastisitas = 1)", "elastis sempurna", "inelastis sempurna"], "k": 2, "e": "%ΔP = (12.000 − 10.000) / 10.000 = 20%\n%ΔQ = (80 − 100) / 100 = −20%\nEd = 20 / 20 = 1 (nilai mutlak), sehingga permintaan bersifat uniter."}, {"t": "pg", "q": "Berikut data pendapatan nasional Negara \"Bumiraya\" tahun 2025.", "d": {"h": 1, "r": [["Komponen", "Jumlah (miliar rupiah)"], ["Konsumsi rumah tangga", "600"], ["Investasi", "150"], ["Pengeluaran pemerintah", "200"], ["Ekspor", "250"], ["Impor", "200"]]}, "q2": "Berdasarkan data tersebut, besarnya PDB dengan pendekatan pengeluaran adalah ....", "o": ["Rp1.000 miliar", "Rp1.200 miliar", "Rp1.400 miliar", "Rp800 miliar", "Rp1.050 miliar"], "k": 0, "e": "PDB = C + I + G + (X − M)\n= 600 + 150 + 200 + (250 − 200)\n= 1.000 miliar rupiah"}, {"t": "mc", "q": "Pembangunan ekonomi tidak hanya diukur dari pertumbuhan PDB. Manakah yang termasuk indikator pembangunan ekonomi suatu negara?", "o": ["Indeks Pembangunan Manusia (IPM)", "Pendapatan per kapita", "Angka harapan hidup", "Jumlah kendaraan pribadi yang beredar", "Tingkat kemiskinan dan pengangguran"], "k": [0, 1, 2, 4], "e": "IPM, pendapatan per kapita, angka harapan hidup (kesehatan), serta tingkat kemiskinan dan pengangguran mencerminkan kesejahteraan dan struktur ekonomi. Jumlah kendaraan pribadi bukan indikator pembangunan."}, {"t": "bs", "q": "Perhatikan kondisi berikut. Dani baru lulus SMK dan sedang mencari pekerjaan pertamanya. Ela kehilangan pekerjaan karena pabrik tempatnya bekerja beralih memakai mesin otomatis. Fajar di-PHK karena resesi menurunkan permintaan barang. Gita bekerja di sawah hanya pada musim tanam dan menganggur pada musim lainnya.\n\nTentukan setiap pernyataan berikut Benar atau Salah.", "s": ["Dani merupakan pengangguran friksional.", "Ela merupakan pengangguran siklis.", "Fajar merupakan pengangguran siklis.", "Gita merupakan pengangguran musiman."], "k": [1, 0, 1, 1], "e": "Dani sedang mencari kerja pertama: friksional (Benar). Ela kehilangan kerja karena perubahan teknologi/struktur produksi: struktural, bukan siklis (Salah). Fajar di-PHK akibat turunnya permintaan saat resesi: siklis (Benar). Gita menganggur mengikuti musim: musiman (Benar)."}, {"t": "mc", "q": "Manakah pernyataan yang benar mengenai pendekatan perhitungan pendapatan nasional?", "o": ["Pendekatan produksi menjumlahkan nilai tambah semua sektor.", "Pendekatan pengeluaran dihitung dengan rumus C + I + G + (X − M).", "Pendekatan pendapatan menjumlahkan upah, sewa, bunga, dan laba.", "PDB riil dihitung menggunakan harga berlaku.", "PNB selalu lebih kecil daripada PDB."], "k": [0, 1, 2], "e": "Tiga pendekatan: produksi, pengeluaran, dan pendapatan. PDB riil memakai harga konstan (bukan harga berlaku), dan PNB dapat lebih besar atau lebih kecil daripada PDB tergantung pendapatan neto faktor luar negeri."}, {"t": "bs", "q": "Perhatikan data pertumbuhan ekonomi dan Indeks Gini Negara Nusantara. Tentukan setiap pernyataan Benar atau Salah.", "d": {"h": 1, "r": [["Tahun", "Pertumbuhan Ekonomi (%)", "Indeks Gini"], ["2021", "4,0", "0,400"], ["2022", "5,0", "0,390"], ["2023", "5,5", "0,410"], ["2024", "5,2", "0,380"]]}, "s": ["Pada tahun 2022 pertumbuhan ekonomi naik dan Indeks Gini turun, yang menunjukkan pemerataan pendapatan membaik.", "Pada tahun 2023 pertumbuhan ekonomi tertinggi, tetapi ketimpangan pendapatan justru melebar.", "Pada tahun 2024 pertumbuhan ekonomi turun dan Indeks Gini naik."], "k": [1, 1, 0], "e": "2022: pertumbuhan 4,0 ke 5,0 dan Gini 0,400 ke 0,390 (Benar). 2023: pertumbuhan 5,5% tertinggi tetapi Gini naik ke 0,410 (Benar). 2024: pertumbuhan turun ke 5,2% tetapi Gini turun ke 0,380, bukan naik (Salah)."}, {"t": "pg", "q": "Banyak lulusan SMK menganggur karena keterampilannya tidak sesuai dengan kebutuhan industri. Solusi yang paling tepat untuk mengatasi masalah tersebut adalah ....", "o": ["Memberikan bantuan tunai tanpa batas waktu kepada lulusan SMK.", "Menurunkan batas usia minimum bekerja.", "Membatasi jumlah lulusan SMK setiap tahun.", "Menjalin kerja sama sekolah dengan industri (link and match) dan pelatihan berbasis kompetensi.", "Melarang perusahaan menetapkan kualifikasi pekerja."], "k": 3, "e": "Akar masalahnya adalah ketidaksesuaian keterampilan dengan kebutuhan industri (pengangguran struktural). Link and match dan pelatihan berbasis kompetensi menyelaraskan keduanya, sedangkan opsi lain tidak menyentuh akar masalah."}, {"t": "pg", "q": "Harga BBM naik sehingga biaya angkut dan biaya produksi barang meningkat, lalu perusahaan menaikkan harga jual. Jenis inflasi yang terjadi adalah ....", "o": ["inflasi tarikan permintaan (demand pull inflation)", "inflasi dorongan biaya (cost push inflation)", "inflasi impor (imported inflation)", "inflasi merayap", "hiperinflasi"], "k": 1, "e": "Kenaikan harga BBM menaikkan biaya produksi dan distribusi sehingga harga jual naik. Inflasi yang berasal dari kenaikan biaya produksi disebut cost push inflation."}, {"t": "pg", "q": "Perhatikan data harga bahan pokok berikut (Rp).", "d": {"h": 1, "r": [["Barang", "2024", "2025"], ["Beras (kg)", "15.000", "16.500"], ["Minyak goreng (liter)", "10.000", "11.000"], ["Gula (kg)", "25.000", "27.500"], ["Telur (kg)", "30.000", "35.000"]]}, "q2": "Besarnya Indeks Harga Konsumen (IHK) tahun 2025 dengan metode agregatif sederhana adalah ....", "o": ["112,5%", "110%", "111,1%", "90%", "125%"], "k": 0, "e": "IHK = (ΣPn / ΣP0) × 100%\nΣP2025 = 16.500 + 11.000 + 27.500 + 35.000 = 90.000\nΣP2024 = 15.000 + 10.000 + 25.000 + 30.000 = 80.000\nIHK = 90.000 / 80.000 × 100% = 112,5%"}, {"t": "pg", "q": "IHK suatu daerah pada tahun 2024 sebesar 120 dan pada tahun 2025 sebesar 129. Laju inflasi tahun 2025 adalah ....", "o": ["7,5%", "9%", "10%", "12,9%", "6,98%"], "k": 0, "e": "Inflasi = (IHK2025 − IHK2024) / IHK2024 × 100%\n= (129 − 120) / 120 × 100% = 7,5%"}, {"t": "mc", "q": "Inflasi di suatu negara meningkat tajam akibat uang beredar yang terlalu banyak. Bank Indonesia ingin menurunkan inflasi dengan kebijakan moneter kontraktif. Manakah langkah yang sesuai?", "o": ["Menaikkan suku bunga acuan.", "Menjual surat berharga di pasar terbuka.", "Menaikkan rasio giro wajib minimum (GWM).", "Menurunkan suku bunga acuan.", "Membeli surat berharga di pasar terbuka."], "k": [0, 1, 2], "e": "Kebijakan kontraktif mengurangi uang beredar: menaikkan suku bunga acuan, menjual surat berharga (operasi pasar terbuka), dan menaikkan GWM. Menurunkan suku bunga dan membeli surat berharga adalah kebijakan ekspansif."}, {"t": "mc", "q": "Bank Indonesia sebagai bank sentral memiliki tugas dan wewenang tertentu. Manakah yang termasuk peran Bank Indonesia?", "o": ["Menetapkan dan melaksanakan kebijakan moneter.", "Mengatur dan mengedarkan uang rupiah.", "Menjaga stabilitas nilai rupiah.", "Menerima tabungan dan deposito dari nasabah.", "Menyalurkan kredit langsung kepada masyarakat."], "k": [0, 1, 2], "e": "BI menetapkan kebijakan moneter, mengatur dan mengedarkan rupiah, serta menjaga kestabilan nilai rupiah. Menerima tabungan/deposito dan menyalurkan kredit adalah fungsi bank umum."}, {"t": "mc", "q": "Perekonomian sedang resesi dengan pengangguran meningkat dan daya beli melemah. Manakah kebijakan fiskal yang sesuai untuk menggerakkan perekonomian?", "o": ["Menambah belanja pemerintah untuk proyek infrastruktur.", "Menurunkan tarif pajak penghasilan.", "Memberikan subsidi dan bantuan langsung kepada masyarakat.", "Menaikkan tarif pajak secara tajam.", "Mengurangi belanja pemerintah."], "k": [0, 1, 2], "e": "Saat resesi digunakan kebijakan fiskal ekspansif: menambah belanja, menurunkan pajak, dan memberi subsidi/bantuan. Menaikkan pajak dan mengurangi belanja bersifat kontraktif sehingga memperlemah ekonomi."}, {"t": "pg", "q": "Pajak yang beban pembayarannya tidak dapat dilimpahkan kepada pihak lain dan dipungut oleh pemerintah pusat adalah ....", "o": ["Pajak Pertambahan Nilai (PPN)", "Pajak Penjualan atas Barang Mewah (PPnBM)", "Pajak Penghasilan (PPh)", "Bea Materai", "Pajak Kendaraan Bermotor (PKB)"], "k": 2, "e": "Pajak langsung adalah pajak yang ditanggung langsung oleh wajib pajak dan tidak dapat dialihkan. PPh adalah pajak langsung pusat. PPN, PPnBM, dan bea materai adalah pajak tidak langsung, sedangkan PKB adalah pajak daerah."}, {"t": "mc", "q": "Manakah pernyataan yang benar mengenai fungsi dan jenis pajak?", "o": ["Fungsi budgeter: pajak menjadi sumber penerimaan negara.", "Fungsi regulerend: tarif pajak tinggi pada rokok untuk mengurangi konsumsi.", "Fungsi redistribusi: pajak penghasilan progresif membantu pemerataan pendapatan.", "Pajak Pertambahan Nilai (PPN) termasuk pajak langsung.", "Pajak langsung bebannya dapat dialihkan kepada konsumen."], "k": [0, 1, 2], "e": "Tiga pernyataan pertama menggambarkan fungsi budgeter, regulerend, dan redistribusi. PPN adalah pajak tidak langsung, dan beban pajak langsung ditanggung sendiri oleh wajib pajak."}, {"t": "mc", "q": "Manakah pernyataan yang benar mengenai koperasi?", "o": ["Rapat Anggota Tahunan (RAT) merupakan kekuasaan tertinggi dalam koperasi.", "Sisa Hasil Usaha (SHU) dibagi sesuai jasa usaha dan jasa modal anggota.", "Hak suara anggota ditentukan oleh besar simpanan masing-masing.", "Modal koperasi berasal dari simpanan pokok, simpanan wajib, dan simpanan sukarela.", "Koperasi hanya boleh didirikan oleh pemerintah."], "k": [0, 1, 3], "e": "RAT adalah kekuasaan tertinggi, SHU dibagi menurut jasa usaha dan jasa modal anggota, dan modal berasal dari simpanan pokok, wajib, dan sukarela. Hak suara koperasi satu anggota satu suara (bukan menurut modal), dan koperasi didirikan oleh anggotanya, bukan hanya oleh pemerintah."}, {"t": "pg", "q": "CV Karya Mandiri kesulitan membayar tagihan walaupun penjualannya naik, karena uang tertahan pada persediaan barang yang menumpuk dan piutang pelanggan yang belum ditagih. Solusi yang paling tepat adalah ....", "o": ["mengelola modal kerja dengan mengatur persediaan dan menagih piutang tepat waktu.", "menambah stok barang agar penjualan naik.", "memperpanjang tenggat pembayaran piutang pelanggan.", "menutup usaha sementara.", "menaikkan gaji karyawan agar lebih termotivasi."], "k": 0, "e": "Masalahnya kas tertahan pada persediaan dan piutang (pengelolaan modal kerja buruk). Mengatur persediaan dan menagih piutang tepat waktu mengembalikan arus kas."}, {"t": "pg", "q": "Koperasi Sumber Rejeki memiliki data berikut.", "o": ["Rp2.760.000,00", "Rp2.400.000,00", "Rp3.060.000,00", "Rp1.800.000,00", "Rp960.000,00"], "k": 0, "e": "Jasa usaha: 6 jt / 300 jt × (40% × 120 jt = 48 jt) = 960.000\nJasa modal: 3 jt / 60 jt × (30% × 120 jt = 36 jt) = 1.800.000\nTotal SHU Bu Tuti = 960.000 + 1.800.000 = Rp2.760.000", "d": {"h": 1, "r": [["Keterangan", "Jumlah"], ["Simpanan seluruh anggota", "Rp60.000.000,00"], ["Transaksi seluruh anggota", "Rp300.000.000,00"], ["SHU tahun berjalan", "Rp120.000.000,00"], ["Jasa usaha", "40%"], ["Jasa modal", "30%"], ["Jasa pengurus", "20%"], ["Cadangan", "10%"]]}, "q2": "Jika Bu Tuti (anggota biasa) memiliki simpanan Rp3.000.000,00 dan transaksi Rp6.000.000,00, maka SHU yang diterima Bu Tuti adalah ...."}, {"t": "pg", "q": "Indonesia dan Jepang menandatangani perjanjian kemitraan ekonomi (IJEPA) yang hanya melibatkan dua negara. Negara-negara ASEAN membentuk kawasan perdagangan bebas (AFTA). Selain itu, Indonesia menjadi anggota WTO yang beranggotakan banyak negara di dunia. Jenis kerja sama internasional yang tepat berturut-turut untuk IJEPA, AFTA, dan WTO adalah ....", "o": ["regional, bilateral, multilateral", "bilateral, regional, multilateral", "bilateral, multilateral, regional", "multilateral, regional, bilateral", "regional, multilateral, bilateral"], "k": 1, "e": "IJEPA hanya melibatkan Indonesia dan Jepang (bilateral). AFTA melibatkan negara ASEAN dalam satu kawasan (regional). WTO beranggotakan banyak negara dari seluruh dunia (multilateral)."}, {"t": "pg", "q": "Negara Y dibanjiri impor beras murah sehingga petani lokal merugi. Kebijakan perdagangan internasional yang paling tepat untuk melindungi petani sekaligus menjaga pasokan adalah ....", "o": ["Menghapus seluruh bea masuk impor beras.", "Melarang seluruh impor beras selamanya.", "Menurunkan nilai tukar mata uang secara drastis.", "Memperbesar ekspor beras tanpa menjaga stok dalam negeri.", "Menetapkan kuota atau tarif impor beras serta memberi subsidi sarana produksi kepada petani."], "k": 4, "e": "Kuota/tarif impor melindungi petani dari banjir impor, sementara subsidi sarana produksi meningkatkan daya saing. Opsi lain terlalu ekstrem atau merugikan: menghapus bea masuk memperburuk keadaan, larangan total mengganggu pasokan, dan devaluasi drastis memicu inflasi."}, {"t": "mc", "q": "Pemerintah mengenakan bea masuk yang tinggi atas impor tekstil untuk melindungi industri dalam negeri. Manakah dampak logis dari kebijakan tersebut?", "o": ["Harga tekstil impor di dalam negeri menjadi lebih mahal.", "Produsen tekstil lokal lebih terlindungi dari persaingan.", "Penerimaan negara dari bea masuk meningkat.", "Volume impor tekstil cenderung meningkat.", "Konsumen memperoleh tekstil impor dengan harga lebih murah."], "k": [0, 1, 2], "e": "Bea masuk menaikkan harga barang impor sehingga produk lokal lebih kompetitif dan negara menerima pemasukan tambahan. Volume impor cenderung turun, dan harga bagi konsumen justru lebih mahal."}, {"t": "mc", "q": "Perhatikan transaksi PT Cipta Karya berikut.\n1. Pemilik menyetor modal tunai Rp20.000.000.\n2. Dibeli perlengkapan kantor secara tunai Rp3.000.000.\n3. Dibeli peralatan kantor secara kredit Rp8.000.000.\n4. Dibayar utang usaha secara tunai Rp2.000.000.\n5. Diterima pendapatan jasa secara tunai Rp5.000.000.\n\nManakah transaksi yang menyebabkan perubahan pada jumlah (total) aset?", "o": ["Transaksi 1", "Transaksi 2", "Transaksi 3", "Transaksi 4", "Transaksi 5"], "k": [0, 2, 3, 4], "e": "T1: kas naik 20 jt dan modal naik. T2: kas turun 3 jt dan perlengkapan naik 3 jt (hanya pertukaran antaraset, total tetap). T3: peralatan naik 8 jt dan utang naik 8 jt. T4: kas turun 2 jt dan utang turun 2 jt. T5: kas naik 5 jt dan modal (pendapatan) naik. Jadi total aset berubah pada transaksi 1, 3, 4, dan 5."}, {"t": "pg", "q": "Bengkel Maju memiliki aset Rp80.000.000 dan utang Rp25.000.000. Kemudian bengkel membayar utang secara tunai Rp5.000.000 dan membeli perlengkapan secara tunai Rp3.000.000. Persamaan dasar akuntansi setelah kedua transaksi adalah ....", "o": ["Aset Rp75.000.000 = Utang Rp20.000.000 + Modal Rp55.000.000", "Aset Rp72.000.000 = Utang Rp20.000.000 + Modal Rp52.000.000", "Aset Rp80.000.000 = Utang Rp20.000.000 + Modal Rp60.000.000", "Aset Rp75.000.000 = Utang Rp25.000.000 + Modal Rp50.000.000", "Aset Rp77.000.000 = Utang Rp22.000.000 + Modal Rp55.000.000"], "k": 0, "e": "Modal awal = 80 jt − 25 jt = 55 jt. Bayar utang tunai: kas −5 jt dan utang −5 jt (aset 75 jt, utang 20 jt). Beli perlengkapan tunai hanya menukar kas dengan perlengkapan sehingga aset tetap 75 jt. Hasil: 75 jt = 20 jt + 55 jt."}, {"t": "pg", "q": "Sebuah bengkel memiliki modal awal Rp50.000.000,00. Selama satu bulan, bengkel memperoleh pendapatan Rp30.000.000,00, mengeluarkan beban Rp18.000.000,00, dan pemilik mengambil prive Rp4.000.000,00. Besarnya modal akhir bengkel tersebut adalah ....", "o": ["Rp58.000.000,00", "Rp62.000.000,00", "Rp66.000.000,00", "Rp52.000.000,00", "Rp74.000.000,00"], "k": 0, "e": "Laba bersih = 30.000.000 − 18.000.000 = 12.000.000\nModal akhir = modal awal + laba − prive\n= 50.000.000 + 12.000.000 − 4.000.000 = Rp58.000.000"}];
const T={1:{n:'Try Out 1',d:3600,q:Q1},2:{n:'Try Out 2',d:3600,q:Q2}};

const $=s=>document.querySelector(s),app=$('#app');

 if(q.t==='pg')return a===q.k?1:0;

function sel(n){SEL=n;Q=T[n].q;DUR=T[n].d;[1,2].forEach(x=>$('#t'+x).classList.toggle('on',x===n));$('#inf').textContent=T[n].n+' · '+Q.length+' soal · '+DUR/60+' menit'}

 <div class=wrap><div class=card><h2>Pilih Paket Soal</h2><div class=pk>${[1,2].map(n=>`<button class=pkb id=t${n} onclick="sel(${n})"><b>${T[n].n}</b><span>${T[n].q.length} soal · ${T[n].d/60} menit</span></button>`).join('')}</div><div id=inf style="margin-top:8px;color:var(--mut);font-size:.9rem"></div></div>
